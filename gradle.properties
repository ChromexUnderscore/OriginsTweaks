# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod Properties
mod_version=1.19.1
maven_group=com.chromexunderscore.originstweaks
archives_base_name=originstweaks

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.18.4
loom_version=1.14-SNAPSHOT

# Fabric API
fabric_api_version=0.116.7+1.21.1

# Origins / Apoli
# Apoli, Calio and Cardinal Components ship inside the Origins jar and are not on Maven, so the
# jars are read from libs/. build.gradle downloads and unpacks them automatically when missing.
origins_url=https://cdn.modrinth.com/data/3BeIrqZR/versions/6LJ1AFwo/Origins-1.13.0-pre.4%2Bmc.1.21.1.jar
origins_jar=Origins-1.13.0-pre.4+mc.1.21.1.jar
apoli_jar=apoli-2.12.0-pre.4+mc.1.21.1.jar
calio_jar=calio-1.14.0+mc.1.21.x.jar
cardinal_components_base_jar=cardinal-components-base-6.1.0.jar
cardinal_components_entity_jar=cardinal-components-entity-6.1.0.jar
